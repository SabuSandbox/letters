<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Intern Letter</title>
    
    <!-- Required Libraries for Word Document Generation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/docxtemplater/3.37.11/docxtemplater.js"></script>
    <script src="https://unpkg.com/pizzip@3.1.4/dist/pizzip.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/1.3.8/FileSaver.js"></script>
    <script src="https://unpkg.com/pizzip@3.1.4/dist/pizzip-utils.js"></script>

    <style>
        /* --- FORM UI STYLES --- */
        body { 
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            margin: 0;
            background-color: #050505; 
            background-image: radial-gradient(circle at 50% 50%, #110a1f 0%, #050505 100%);
            color: #ffffff; 
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 40px 20px;
        }
        .glow-wrapper {
            position: relative; width: 100%; max-width: 800px; border-radius: 16px; z-index: 1;
        }
        .glow-wrapper::before {
            content: ''; position: absolute; top: -2px; left: -2px; right: -2px; bottom: -2px;
            background: linear-gradient(135deg, #2e7d32 0%, #1565c0 40%, transparent 80%);
            border-radius: 18px; z-index: -1; filter: blur(8px); opacity: 0.8;
        }
        .card-content {
            background: #0f0a18; border-radius: 16px; padding: 40px 50px;
            border: 1px solid rgba(255, 255, 255, 0.05); box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
        }
        .form-header { text-align: center; margin-bottom: 35px; }
        .form-header h2 { font-size: 24px; font-weight: 600; margin-bottom: 8px; color: #fff; }
        .form-header p { color: #aaa; font-size: 13px; margin: 0; } 
        
        .form-row { display: flex; gap: 20px; margin-bottom: 15px; }
        .form-group { flex: 1; }
        .letter-type { display: flex; gap: 24px; margin: 0 0 24px; }
        .letter-type label { display: flex; align-items: center; gap: 8px; margin: 0; font-size: 14px; cursor: pointer; }
        .letter-type input { accent-color: #3184df; }
        .mode-fields[hidden] { display: none; }
        .rich-editor {
            width: 100%; min-height: 180px; padding: 12px 14px; background: rgba(255,255,255,.07);
            border: 1px solid rgba(255,255,255,.2); border-radius: 8px; box-sizing: border-box;
            font-size: 13px; line-height: 1.5; color: #fff; outline: none; overflow-wrap: anywhere;
        }
        .rich-editor:focus { border-color: #1565c0; background: rgba(255,255,255,.1); }
        .rich-editor:empty::before { content: attr(data-placeholder); color: #888; pointer-events: none; }
        .rich-editor p { margin: 0 0 1em; }
        .choice-group { display: flex; gap: 22px; margin: 0 0 18px; }
        .choice-group label { display: flex; align-items: center; gap: 8px; margin: 0; cursor: pointer; font-size: 13px; }
        .choice-group input { accent-color: #3184df; }
        .field-note { margin: -8px 0 16px; color: #aaa; font-size: 12px; }
        
        label { display: block; font-weight: 400; margin-bottom: 8px; font-size: 12px; color: #ccc; } 
        input[type="text"] { 
            width: 100%; padding: 12px 14px; background: rgba(255, 255, 255, 0.07); 
            border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 8px; 
            box-sizing: border-box; font-size: 13px; color: #ffffff; outline: none; transition: all 0.2s ease;
        }
        input::placeholder { color: #888; } 
        input:focus { border-color: #1565c0; background: rgba(255, 255, 255, 0.1); }
        
        button { 
            width: 100%; border: none; padding: 14px; cursor: pointer; border-radius: 8px; 
            font-weight: 600; font-size: 15px; transition: opacity 0.2s, transform 0.1s;
            margin-top: 25px;
        }
        button:active { transform: scale(0.98); }
        .btn-primary { background: #1565c0; color: #ffffff; }
        .btn-primary:hover { background: #0d47a1; }
        
        @media (max-width: 600px) {
            .form-row { flex-direction: column; gap: 15px; }
            .card-content { padding: 30px 20px; }
        }
    </style>
</head>
<body>

<div class="glow-wrapper">
    <div class="card-content">
        <div class="form-header">
            <h2>Intern Letter</h2>
            <p>Enter details below to generate the Word document.</p>
        </div>

        <form id="letter-form">
            <fieldset class="letter-type" aria-label="Letter type">
                <label><input type="radio" name="letterType" value="internship" checked> Internship letter</label>
                <label><input type="radio" name="letterType" value="custom"> Customised letter</label>
            </fieldset>

            <div id="internship-fields" class="mode-fields">
            <div class="form-row">
                <div class="form-group">
                    <label>Letter Date</label>
                    <input type="text" id="letterDate" placeholder="e.g., 30th July, 2026" required>
                </div>
                <div class="form-group">
                    <label>Intern Name</label>
                    <input type="text" id="internName" placeholder="Intern Name" required>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Department</label>
                    <input type="text" id="department" placeholder="e.g., Department" value="IT Department">
                </div>
                <div class="form-group">
                    <label>Position</label>
                    <input type="text" id="position" placeholder="e.g., Intern" value="Intern">
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Date of Joining</label>
                    <input type="text" id="joiningDate" placeholder="e.g., 3rd August 2026">
                </div>
                <div class="form-group">
                    <label>Tenure</label>
                    <input type="text" id="tenure" placeholder="e.g., 2 months" value="2 months">
                </div>
            </div>
            
            <div class="form-row">
                <div class="form-group">
                    <label>Reporting To</label>
                    <input type="text" id="reportingTo" placeholder="e.g., Reporting to">
                </div>
                <div class="form-group">
                    <label>Location</label>
                    <input type="text" id="location" value="Plot No 51, Sector-32, Gurugram, Haryana">
                </div>
            </div>
            </div>

            <div id="custom-fields" class="mode-fields" hidden>
                <div class="form-row"><div class="form-group">
                    <label for="recipient">To</label>
                    <input type="text" id="recipient" placeholder="Name and organisation" required disabled>
                </div></div>
                <div class="form-row"><div class="form-group">
                    <label for="subject">Subject</label>
                    <input type="text" id="subject" placeholder="Letter subject" required disabled>
                </div></div>
                <div class="form-row"><div class="form-group">
                    <label id="body-label" for="body">Letter body</label>
                    <div id="body" class="rich-editor" contenteditable="true" role="textbox" aria-labelledby="body-label" aria-multiline="true" data-placeholder="Write or paste the letter body here." tabindex="0" hidden></div>
                </div></div>
                <fieldset class="choice-group" aria-label="Authorised signatory">
                    <label><input type="radio" name="signatoryMode" value="current" checked> Current authorised signatory</label>
                    <label><input type="radio" name="signatoryMode" value="new"> New authorised signatory</label>
                </fieldset>
                <p id="current-signatory-note" class="field-note">Uses the existing Sudhir Kumar, AVP-HR signature from the template.</p>
                <div id="new-signatory-fields" hidden>
                <div class="form-row"><div class="form-group">
                    <label for="signatoryName">Authorised signatory name</label>
                    <input type="text" id="signatoryName" required disabled>
                </div><div class="form-group">
                    <label for="signatoryDesignation">Designation</label>
                    <input type="text" id="signatoryDesignation" required disabled>
                </div></div>
                <div class="form-row"><div class="form-group">
                    <label for="signatoryAddress">Address</label>
                    <input type="text" id="signatoryAddress" disabled>
                </div><div class="form-group">
                    <label for="signatoryContact">Contact number</label>
                    <input type="text" id="signatoryContact" disabled>
                </div></div>
                <div class="form-row"><div class="form-group">
                    <label for="signatoryEmail">Email</label>
                    <input type="text" id="signatoryEmail" disabled>
                </div></div>
                </div>
            </div>
            
            <button type="button" class="btn-primary" onclick="generateWordDoc()">Download Word (.docx)</button>
        </form>
    </div>
</div>

<script>
    // Automatically set today's date on load
    document.addEventListener("DOMContentLoaded", () => {
        const today = new Date();
        const formattedDate = today.toLocaleDateString('en-GB', { 
            day: 'numeric', month: 'long', year: 'numeric' 
        });
        
        const day = today.getDate();
        const suffix = (day % 10 === 1 && day !== 11) ? 'st' :
                       (day % 10 === 2 && day !== 12) ? 'nd' :
                       (day % 10 === 3 && day !== 13) ? 'rd' : 'th';
        
        const month = today.toLocaleString('default', { month: 'long' });
        const year = today.getFullYear();
        
        document.getElementById('letterDate').value = `${day}${suffix} ${month}, ${year}`;
        document.querySelectorAll('input[name="letterType"]').forEach((radio) => {
            radio.addEventListener('change', updateLetterMode);
        });
        document.querySelectorAll('input[name="signatoryMode"]').forEach((radio) => {
            radio.addEventListener('change', updateSignatoryMode);
        });
        updateLetterMode();
        updateSignatoryMode();
    });

    function updateLetterMode() {
        const custom = document.querySelector('input[name="letterType"]:checked').value === 'custom';
        document.getElementById('internship-fields').hidden = custom;
        document.getElementById('custom-fields').hidden = !custom;
        document.querySelectorAll('#internship-fields input, #custom-fields input').forEach((field) => {
            field.disabled = custom ? field.closest('#internship-fields') !== null : field.closest('#custom-fields') !== null;
        });
        const body = document.getElementById('body');
        body.hidden = !custom;
        body.setAttribute('contenteditable', custom ? 'true' : 'false');
        updateSignatoryMode();
    }

    function updateSignatoryMode() {
        const fieldGroup = document.getElementById('new-signatory-fields');
        if (!fieldGroup) return;
        const useNew = document.querySelector('input[name="signatoryMode"]:checked').value === 'new';
        fieldGroup.hidden = !useNew;
        document.getElementById('current-signatory-note').hidden = useNew;
        fieldGroup.querySelectorAll('input').forEach((field) => {
            field.disabled = !useNew || document.getElementById('custom-fields').hidden;
        });
    }

    // --- WORD DOCUMENT GENERATION ---
    function loadFile(url, callback) {
        PizZipUtils.getBinaryContent(url, callback);
    }

    function generateWordDoc() {
        const isCustom = document.querySelector('input[name="letterType"]:checked').value === 'custom';
        const form = document.getElementById('letter-form');
        if (!form.reportValidity()) return;

        if (isCustom) {
            const bodyElement = document.getElementById('body');
            if (!bodyElement.textContent.trim()) {
                bodyElement.focus();
                alert('Please enter the letter body.');
                return;
            }
            const customData = {
                letterDate: document.getElementById('letterDate').value,
                recipient: document.getElementById('recipient').value.trim(),
                subject: document.getElementById('subject').value.trim(),
                bodyXml: bodyToWordXml(bodyElement),
                signatoryName: document.getElementById('signatoryName').value.trim(),
                signatoryDesignation: document.getElementById('signatoryDesignation').value.trim(),
                signatoryAddress: document.getElementById('signatoryAddress').value.trim(),
                signatoryContact: document.getElementById('signatoryContact').value.trim(),
                signatoryEmail: document.getElementById('signatoryEmail').value.trim(),
                signatoryMode: document.querySelector('input[name="signatoryMode"]:checked').value
            };
            loadFile('custom_letter_template.docx', function(error, content) {
                if (error) { alert("Error: Could not load 'custom_letter_template.docx'. Make sure it is in the same folder and you are running this on a local web server."); return; }
                try {
                    const doc = new window.docxtemplater(new PizZip(content), { paragraphLoop: true, linebreaks: true });
                    doc.render(customData);
                    removeCurrentSignatoryForNewLetter(doc, customData.signatoryMode);
                    const out = doc.getZip().generate({ type: 'blob', mimeType: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document' });
                    const safeName = customData.recipient.replace(/[^a-zA-Z0-9]/g, '_') || 'Recipient';
                    saveAs(out, `Custom_Letter_${safeName}.docx`);
                } catch (error) { console.error(error); alert('Could not generate the letter. Check the entered content and template.'); }
            });
            return;
        }

        const templateData = {
            letterDate: document.getElementById('letterDate').value,
            internName: document.getElementById('internName').value,
            department: document.getElementById('department').value,
            position: document.getElementById('position').value,
            joiningDate: document.getElementById('joiningDate').value,
            tenure: document.getElementById('tenure').value,
            location: document.getElementById('location').value,
            reportingTo: document.getElementById('reportingTo').value
        };

        // Looks for your specific template file[cite: 3]
        loadFile("letter_template.docx", function(error, content) {
            if (error) { 
                alert("Error: Could not load 'letter_template.docx'. Make sure it is in the same folder and you are running this on a local web server.");
                throw error; 
            }
            
            var zip = new PizZip(content);
            var doc = new window.docxtemplater(zip, { paragraphLoop: true, linebreaks: true });

            try {
                doc.render(templateData);
            } catch (error) {
                console.error("Error during rendering:", error);
                alert("An error occurred mapping the data. Check your template tags.");
                return;
            }

            var out = doc.getZip().generate({ 
                type: "blob", 
                mimeType: "application/vnd.openxmlformats-officedocument.wordprocessingml.document" 
            });
            
            const sanitizedName = templateData.internName.replace(/[^a-zA-Z0-9]/g, '_') || 'Intern';
            saveAs(out, `Internship_Letter_${sanitizedName}.docx`);
        });
    }

    function removeCurrentSignatoryForNewLetter(doc, signatoryMode) {
        const file = doc.getZip().file('word/document.xml');
        const xmlDoc = new DOMParser().parseFromString(file.asText(), 'application/xml');
        const wordNs = 'http://schemas.openxmlformats.org/wordprocessingml/2006/main';
        const paragraphs = Array.from(xmlDoc.getElementsByTagNameNS(wordNs, 'p'));
        const markers = ['[[newSignatoryName]]', '[[newSignatoryDetails]]'];
        paragraphs.forEach((paragraph) => {
            const text = paragraph.textContent || '';
            const marker = markers.find((candidate) => text.includes(candidate));
            if (marker) {
                if (signatoryMode === 'current') paragraph.parentNode.removeChild(paragraph);
                else Array.from(paragraph.getElementsByTagNameNS(wordNs, 't')).forEach((node) => { node.textContent = node.textContent.replace(marker, ''); });
            } else if (signatoryMode === 'new' && text.includes('For Pearl Global Industries Limited')) {
                Array.from(paragraph.getElementsByTagNameNS(wordNs, 'drawing')).forEach((drawing) => drawing.parentNode.removeChild(drawing));
            }
        });
        doc.getZip().file('word/document.xml', new XMLSerializer().serializeToString(xmlDoc));
    }

    function bodyToWordXml(editor) {
        const xml = (value) => String(value).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        const xmlAttr = (value) => xml(value).replace(/"/g, '&quot;');
        const paragraphs = [];

        function runXml(text, marks) {
            if (!text) return '';
            const props = [];
            if (marks.bold) props.push('<w:b/>');
            if (marks.italic) props.push('<w:i/>');
            if (marks.underline) props.push('<w:u w:val="single"/>');
            if (marks.strike) props.push('<w:strike/>');
            if (marks.sup) props.push('<w:vertAlign w:val="superscript"/>');
            if (marks.sub) props.push('<w:vertAlign w:val="subscript"/>');
            if (marks.color) props.push(`<w:color w:val="${marks.color}"/>`);
            if (marks.background) props.push(`<w:shd w:val="clear" w:color="auto" w:fill="${marks.background}"/>`);
            if (marks.font) {
                const font = xmlAttr(marks.font);
                props.push(`<w:rFonts w:ascii="${font}" w:hAnsi="${font}" w:eastAsia="${font}"/>`);
            }
            if (marks.size) props.push(`<w:sz w:val="${marks.size}"/><w:szCs w:val="${marks.size}"/>`);
            return `<w:r>${props.length ? `<w:rPr>${props.join('')}</w:rPr>` : ''}<w:t xml:space="preserve">${xml(text)}</w:t></w:r>`;
        }

        function walk(node, marks, paragraph) {
            if (node.nodeType === Node.TEXT_NODE) return runXml(node.nodeValue, marks);
            if (node.nodeType !== Node.ELEMENT_NODE) return '';
            const tag = node.tagName.toUpperCase();
            const next = { ...marks };
            if (tag === 'B' || tag === 'STRONG') next.bold = true;
            if (tag === 'I' || tag === 'EM') next.italic = true;
            if (tag === 'U') next.underline = true;
            if (tag === 'S' || tag === 'STRIKE') next.strike = true;
            if (tag === 'SUB') next.sub = true;
            if (tag === 'SUP') next.sup = true;
            const style = node.getAttribute('style') || '';
            if (/font-weight\s*:\s*(?:bold|[6-9]00)/i.test(style)) next.bold = true;
            if (/font-style\s*:\s*italic/i.test(style)) next.italic = true;
            if (/text-decoration(?:-line)?\s*:[^;]*underline/i.test(style)) next.underline = true;
            if (/text-decoration(?:-line)?\s*:[^;]*(?:line-through|strike)/i.test(style)) next.strike = true;
            const toColor = (value) => {
                const hex = value.match(/#([0-9a-f]{3}|[0-9a-f]{6})/i);
                if (hex) return hex[1].length === 3 ? hex[1].split('').map((part) => part + part).join('').toUpperCase() : hex[1].toUpperCase();
                const rgb = value.match(/rgb\(\s*(\d{1,3})\s*,\s*(\d{1,3})\s*,\s*(\d{1,3})\s*\)/i);
                return rgb ? rgb.slice(1).map((part) => Number(part).toString(16).padStart(2, '0')).join('').toUpperCase() : '';
            };
            const color = style.match(/(?:^|;)\s*color\s*:\s*([^;]+)/i);
            const background = style.match(/(?:^|;)\s*background-color\s*:\s*([^;]+)/i);
            const size = style.match(/(?:^|;)\s*font-size\s*:\s*([0-9.]+)\s*(pt|px)?/i);
            const font = style.match(/(?:^|;)\s*font-family\s*:\s*([^;]+)/i);
            if (color && toColor(color[1])) next.color = toColor(color[1]);
            if (background && toColor(background[1])) next.background = toColor(background[1]);
            if (size) next.size = Math.round(Number(size[1]) * ((size[2] || 'pt').toLowerCase() === 'px' ? 1.5 : 2));
            if (font) next.font = font[1].split(',')[0].trim().replace(/^['"]|['"]$/g, '');
            if (tag === 'FONT') {
                const face = node.getAttribute('face');
                const fontColor = toColor(node.getAttribute('color') || '');
                const fontSize = Number(node.getAttribute('size'));
                if (face) next.font = face;
                if (fontColor) next.color = fontColor;
                if (fontSize) next.size = Math.max(12, Math.min(72, 2 * (fontSize + 7)));
            }
            if (tag === 'BR') return '<w:r><w:br/></w:r>';
            const children = Array.from(node.childNodes).map((child) => walk(child, next, paragraph)).join('');
            if (tag === 'LI') return `<w:r><w:t>• </w:t></w:r>${children}`;
            return children;
        }

        function paragraphXml(node) {
            const style = node.nodeType === Node.ELEMENT_NODE ? (node.getAttribute('style') || '') : '';
            const spacing = style.match(/(?:^|;)\s*line-height\s*:\s*([0-9.]+)\s*(px|pt|em|%)?/i);
            const spaceAfter = style.match(/(?:^|;)\s*margin-bottom\s*:\s*([0-9.]+)\s*(px|pt|em)?/i);
            const spaceBefore = style.match(/(?:^|;)\s*margin-top\s*:\s*([0-9.]+)\s*(px|pt|em)?/i);
            const alignment = style.match(/(?:^|;)\s*text-align\s*:\s*(left|center|right|justify)/i);
            const indent = style.match(/(?:^|;)\s*margin-left\s*:\s*([0-9.]+)\s*(px|pt)?/i);
            const firstLineIndent = style.match(/(?:^|;)\s*text-indent\s*:\s*([0-9.]+)\s*(px|pt)?/i);
            const pProps = [];
            const spacingAttrs = [];
            if (spacing) {
                const unit = (spacing[2] || '').toLowerCase();
                const line = unit === 'px' ? Math.round(Number(spacing[1]) * 15) :
                    unit === 'pt' ? Math.round(Number(spacing[1]) * 20) :
                    Math.round(Number(spacing[1]) * (unit === '%' ? 2.4 : 240));
                spacingAttrs.push(`w:line="${line}"`, `w:lineRule="${unit === 'px' || unit === 'pt' ? 'exact' : 'auto'}"`);
            }
            const toTwips = (match) => Math.round(Number(match[1]) * ((match[2] || '').toLowerCase() === 'px' ? 15 : 20));
            if (spaceBefore) spacingAttrs.push(`w:before="${toTwips(spaceBefore)}"`);
            if (spaceAfter) spacingAttrs.push(`w:after="${toTwips(spaceAfter)}"`);
            if (spacingAttrs.length) pProps.push(`<w:spacing ${spacingAttrs.join(' ')}/>`);
            if (alignment) pProps.push(`<w:jc w:val="${alignment[1].toLowerCase()}"/>`);
            if (indent || firstLineIndent) {
                const left = indent ? ` w:left="${toTwips(indent)}"` : '';
                const first = firstLineIndent ? ` w:firstLine="${toTwips(firstLineIndent)}"` : '';
                pProps.push(`<w:ind${left}${first}/>`);
            }
            const content = node.nodeType === Node.TEXT_NODE ? runXml(node.nodeValue, {}) : walk(node, {}, node);
            return `<w:p>${pProps.length ? `<w:pPr>${pProps.join('')}</w:pPr>` : ''}${content || '<w:r><w:t></w:t></w:r>'}</w:p>`;
        }

        function collect(node) {
            if (node.nodeType === Node.ELEMENT_NODE && ['P', 'DIV', 'LI'].includes(node.tagName.toUpperCase())) {
                paragraphs.push(paragraphXml(node));
                return;
            }
            if (node.nodeType === Node.ELEMENT_NODE && node.tagName.toUpperCase() === 'BR') {
                paragraphs.push('<w:p><w:r><w:t></w:t></w:r></w:p>');
                return;
            }
            if (node.nodeType === Node.TEXT_NODE && node.nodeValue.trim()) paragraphs.push(paragraphXml(node));
            else Array.from(node.childNodes || []).forEach(collect);
        }
        Array.from(editor.childNodes).forEach(collect);
        return paragraphs.join('');
    }
</script>
</body>
</html>
