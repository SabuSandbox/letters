<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Intern Letter</title>
    
    <!-- Required Libraries for Word Document Generation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/docxtemplater/3.37.11/docxtemplater.js"></script>
    <script src="https://unpkg.com/pizzip@3.1.4/dist/pizzip.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/1.3.8/FileSaver.js"></script>
    <script src="https://unpkg.com/pizzip@3.1.4/dist/pizzip-utils.js"></script>

    <style>
        /* --- FORM UI STYLES --- */
        body { 
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            margin: 0;
            background-color: #050505; 
            background-image: radial-gradient(circle at 50% 50%, #110a1f 0%, #050505 100%);
            color: #ffffff; 
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 40px 20px;
        }
        .glow-wrapper {
            position: relative; width: 100%; max-width: 800px; border-radius: 16px; z-index: 1;
        }
        .glow-wrapper::before {
            content: ''; position: absolute; top: -2px; left: -2px; right: -2px; bottom: -2px;
            background: linear-gradient(135deg, #2e7d32 0%, #1565c0 40%, transparent 80%);
            border-radius: 18px; z-index: -1; filter: blur(8px); opacity: 0.8;
        }
        .card-content {
            background: #0f0a18; border-radius: 16px; padding: 40px 50px;
            border: 1px solid rgba(255, 255, 255, 0.05); box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
        }
        .form-header { text-align: center; margin-bottom: 35px; }
        .form-header h2 { font-size: 24px; font-weight: 600; margin-bottom: 8px; color: #fff; }
        .form-header p { color: #aaa; font-size: 13px; margin: 0; } 
        
        .form-row { display: flex; gap: 20px; margin-bottom: 15px; }
        .form-group { flex: 1; }
        .letter-type { display: flex; gap: 24px; margin: 0 0 24px; }
        .letter-type label { display: flex; align-items: center; gap: 8px; margin: 0; font-size: 14px; cursor: pointer; }
        .letter-type input { accent-color: #3184df; }
        .mode-fields[hidden] { display: none; }
        textarea {
            width: 100%; min-height: 180px; padding: 12px 14px; background: rgba(255,255,255,.07);
            border: 1px solid rgba(255,255,255,.2); border-radius: 8px; box-sizing: border-box;
            font: inherit; font-size: 13px; line-height: 1.5; color: #fff; resize: vertical;
        }
        textarea:focus { outline: none; border-color: #1565c0; background: rgba(255,255,255,.1); }
        
        label { display: block; font-weight: 400; margin-bottom: 8px; font-size: 12px; color: #ccc; } 
        input[type="text"] { 
            width: 100%; padding: 12px 14px; background: rgba(255, 255, 255, 0.07); 
            border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 8px; 
            box-sizing: border-box; font-size: 13px; color: #ffffff; outline: none; transition: all 0.2s ease;
        }
        input::placeholder { color: #888; } 
        input:focus { border-color: #1565c0; background: rgba(255, 255, 255, 0.1); }
        
        button { 
            width: 100%; border: none; padding: 14px; cursor: pointer; border-radius: 8px; 
            font-weight: 600; font-size: 15px; transition: opacity 0.2s, transform 0.1s;
            margin-top: 25px;
        }
        button:active { transform: scale(0.98); }
        .btn-primary { background: #1565c0; color: #ffffff; }
        .btn-primary:hover { background: #0d47a1; }
        
        @media (max-width: 600px) {
            .form-row { flex-direction: column; gap: 15px; }
            .card-content { padding: 30px 20px; }
        }
    </style>
</head>
<body>

<div class="glow-wrapper">
    <div class="card-content">
        <div class="form-header">
            <h2>Intern Letter</h2>
            <p>Enter details below to generate the Word document.</p>
        </div>

        <form id="letter-form">
            <fieldset class="letter-type" aria-label="Letter type">
                <label><input type="radio" name="letterType" value="internship" checked> Internship letter</label>
                <label><input type="radio" name="letterType" value="custom"> Customised letter</label>
            </fieldset>

            <div id="internship-fields" class="mode-fields">
            <div class="form-row">
                <div class="form-group">
                    <label>Letter Date</label>
                    <input type="text" id="letterDate" placeholder="e.g., 30th July, 2026" required>
                </div>
                <div class="form-group">
                    <label>Intern Name</label>
                    <input type="text" id="internName" placeholder="Intern Name" required>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Department</label>
                    <input type="text" id="department" placeholder="e.g., Department" value="IT Department">
                </div>
                <div class="form-group">
                    <label>Position</label>
                    <input type="text" id="position" placeholder="e.g., Intern" value="Intern">
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Date of Joining</label>
                    <input type="text" id="joiningDate" placeholder="e.g., 3rd August 2026">
                </div>
                <div class="form-group">
                    <label>Tenure</label>
                    <input type="text" id="tenure" placeholder="e.g., 2 months" value="2 months">
                </div>
            </div>
            
            <div class="form-row">
                <div class="form-group">
                    <label>Reporting To</label>
                    <input type="text" id="reportingTo" placeholder="e.g., Reporting to">
                </div>
                <div class="form-group">
                    <label>Location</label>
                    <input type="text" id="location" value="Plot No 51, Sector-32, Gurugram, Haryana">
                </div>
            </div>
            </div>

            <div id="custom-fields" class="mode-fields" hidden>
                <div class="form-row"><div class="form-group">
                    <label for="recipient">To</label>
                    <input type="text" id="recipient" placeholder="Name and organisation" required disabled>
                </div></div>
                <div class="form-row"><div class="form-group">
                    <label for="subject">Subject</label>
                    <input type="text" id="subject" placeholder="Letter subject" required disabled>
                </div></div>
                <div class="form-row"><div class="form-group">
                    <label for="body">Letter body</label>
                    <textarea id="body" placeholder="Write the letter body. Use a blank line between paragraphs." required disabled></textarea>
                </div></div>
                <div class="form-row"><div class="form-group">
                    <label for="signatoryName">Authorised signatory name</label>
                    <input type="text" id="signatoryName" required disabled>
                </div><div class="form-group">
                    <label for="signatoryDesignation">Designation</label>
                    <input type="text" id="signatoryDesignation" required disabled>
                </div></div>
                <div class="form-row"><div class="form-group">
                    <label for="signatoryAddress">Address</label>
                    <input type="text" id="signatoryAddress" disabled>
                </div><div class="form-group">
                    <label for="signatoryContact">Contact number</label>
                    <input type="text" id="signatoryContact" disabled>
                </div></div>
                <div class="form-row"><div class="form-group">
                    <label for="signatoryEmail">Email</label>
                    <input type="text" id="signatoryEmail" disabled>
                </div></div>
            </div>
            
            <button type="button" class="btn-primary" onclick="generateWordDoc()">Download Word (.docx)</button>
        </form>
    </div>
</div>

<script>
    // Automatically set today's date on load
    document.addEventListener("DOMContentLoaded", () => {
        const today = new Date();
        const formattedDate = today.toLocaleDateString('en-GB', { 
            day: 'numeric', month: 'long', year: 'numeric' 
        });
        
        const day = today.getDate();
        const suffix = (day % 10 === 1 && day !== 11) ? 'st' :
                       (day % 10 === 2 && day !== 12) ? 'nd' :
                       (day % 10 === 3 && day !== 13) ? 'rd' : 'th';
        
        const month = today.toLocaleString('default', { month: 'long' });
        const year = today.getFullYear();
        
        document.getElementById('letterDate').value = `${day}${suffix} ${month}, ${year}`;
        document.querySelectorAll('input[name="letterType"]').forEach((radio) => {
            radio.addEventListener('change', updateLetterMode);
        });
        updateLetterMode();
    });

    function updateLetterMode() {
        const custom = document.querySelector('input[name="letterType"]:checked').value === 'custom';
        document.getElementById('internship-fields').hidden = custom;
        document.getElementById('custom-fields').hidden = !custom;
        document.querySelectorAll('#internship-fields input, #custom-fields input, #custom-fields textarea').forEach((field) => {
            field.disabled = custom ? field.closest('#internship-fields') !== null : field.closest('#custom-fields') !== null;
        });
    }

    // --- WORD DOCUMENT GENERATION ---
    function loadFile(url, callback) {
        PizZipUtils.getBinaryContent(url, callback);
    }

    function generateWordDoc() {
        const isCustom = document.querySelector('input[name="letterType"]:checked').value === 'custom';
        const form = document.getElementById('letter-form');
        if (!form.reportValidity()) return;

        if (isCustom) {
            const customData = {
                recipient: document.getElementById('recipient').value.trim(),
                salutation: document.getElementById('recipient').value.trim().split(/[\s,]+/)[0],
                subject: document.getElementById('subject').value.trim(),
                body: document.getElementById('body').value.trim(),
                signatoryName: document.getElementById('signatoryName').value.trim(),
                signatoryDesignation: document.getElementById('signatoryDesignation').value.trim(),
                signatoryAddress: document.getElementById('signatoryAddress').value.trim(),
                signatoryContact: document.getElementById('signatoryContact').value.trim(),
                signatoryEmail: document.getElementById('signatoryEmail').value.trim()
            };
            loadFile('custom_letter_template.docx', function(error, content) {
                if (error) { alert("Error: Could not load 'custom_letter_template.docx'. Make sure it is in the same folder and you are running this on a local web server."); return; }
                try {
                    const doc = new window.docxtemplater(new PizZip(content), { paragraphLoop: true, linebreaks: true });
                    doc.render(customData);
                    const out = doc.getZip().generate({ type: 'blob', mimeType: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document' });
                    const safeName = customData.recipient.replace(/[^a-zA-Z0-9]/g, '_') || 'Recipient';
                    saveAs(out, `Custom_Letter_${safeName}.docx`);
                } catch (error) { console.error(error); alert('Could not generate the letter. Check the entered content and template.'); }
            });
            return;
        }

        const templateData = {
            letterDate: document.getElementById('letterDate').value,
            internName: document.getElementById('internName').value,
            department: document.getElementById('department').value,
            position: document.getElementById('position').value,
            joiningDate: document.getElementById('joiningDate').value,
            tenure: document.getElementById('tenure').value,
            location: document.getElementById('location').value,
            reportingTo: document.getElementById('reportingTo').value
        };

        // Looks for your specific template file[cite: 3]
        loadFile("letter_template.docx", function(error, content) {
            if (error) { 
                alert("Error: Could not load 'letter_template.docx'. Make sure it is in the same folder and you are running this on a local web server.");
                throw error; 
            }
            
            var zip = new PizZip(content);
            var doc = new window.docxtemplater(zip, { paragraphLoop: true, linebreaks: true });

            try {
                doc.render(templateData);
            } catch (error) {
                console.error("Error during rendering:", error);
                alert("An error occurred mapping the data. Check your template tags.");
                return;
            }

            var out = doc.getZip().generate({ 
                type: "blob", 
                mimeType: "application/vnd.openxmlformats-officedocument.wordprocessingml.document" 
            });
            
            const sanitizedName = templateData.internName.replace(/[^a-zA-Z0-9]/g, '_') || 'Intern';
            saveAs(out, `Internship_Letter_${sanitizedName}.docx`);
        });
    }
</script>
</body>
</html>
